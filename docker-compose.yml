services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # 之前这里把 27017 直接发布到公网、又没配 mongod 账号密码，等于谁都能连上来
    # 随便读写删——已经因为这个被人拿工具扫到、把库全清空勒索过一次了。mongo 只需要
    # 给同一个 compose 网络里的 server 容器用（内部走服务名 mongo:27017 就能连上），
    # 不需要暴露给宿主机/公网，所以直接去掉端口映射，不再对外开放
    expose:
      - "27017"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/kingbear
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-production}
      OCR_PROVIDER: ${OCR_PROVIDER:-stub}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_MODEL: ${OCR_MODEL:-qwen-vl-plus}
      UPLOAD_DIR: uploads
    volumes:
      - uploads_data:/repo/apps/server/uploads
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mongo_data:
  uploads_data:
